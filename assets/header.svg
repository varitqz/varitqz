<svg width="1280" height="480" viewBox="0 0 1280 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jannik Richter animated GitHub profile header</title>
  <desc id="desc">Animated cloud security themed header with neon HUD, terminal console, scanlines, orbit rings and cyber grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03040A"/>
      <stop offset="0.5" stop-color="#060B15"/>
      <stop offset="1" stop-color="#091227"/>
    </linearGradient>
    <radialGradient id="vGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 120) rotate(10) scale(420 200)">
      <stop stop-color="#8B5CF6" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 280) rotate(-12) scale(380 220)">
      <stop stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="86" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="12" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="480" rx="28" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#grid)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 34" dur="16s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0.26">
      <path d="M0 96H1280" stroke="#fff" stroke-opacity="0.08"/>
      <path d="M0 248H1280" stroke="#fff" stroke-opacity="0.06"/>
      <path d="M0 384H1280" stroke="#fff" stroke-opacity="0.08"/>
    </g>

    <ellipse cx="250" cy="120" rx="420" ry="200" fill="url(#vGlow)">
      <animate attributeName="opacity" values="0.8;1;0.82;0.8" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1050" cy="280" rx="380" ry="220" fill="url(#cGlow)">
      <animate attributeName="opacity" values="0.7;0.45;0.7" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <g opacity="0.16">
      <circle cx="1010" cy="236" r="96" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="1010" cy="236" r="136" stroke="#22D3EE" stroke-width="1.5"/>
      <circle cx="1010" cy="236" r="182" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>

    <g>
      <circle cx="1010" cy="54" r="4" fill="#67E8F9" filter="url(#soft)">
        <animateTransform attributeName="transform" type="rotate" from="0 1010 236" to="360 1010 236" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1192" cy="236" r="4.4" fill="#A78BFA" filter="url(#soft)">
        <animateTransform attributeName="transform" type="rotate" from="0 1010 236" to="-360 1010 236" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="372" r="3.6" fill="#D8B4FE" filter="url(#soft)">
        <animateTransform attributeName="transform" type="rotate" from="0 1010 236" to="360 1010 236" dur="19s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.75">
      <path d="M78 68H230" stroke="#8B5CF6" stroke-opacity="0.45"/>
      <path d="M78 68V96" stroke="#8B5CF6" stroke-opacity="0.45"/>
      <path d="M1202 68H1050" stroke="#67E8F9" stroke-opacity="0.34"/>
      <path d="M1202 68V96" stroke="#67E8F9" stroke-opacity="0.34"/>
      <path d="M78 410H230" stroke="#67E8F9" stroke-opacity="0.28"/>
      <path d="M78 410V382" stroke="#67E8F9" stroke-opacity="0.28"/>
      <path d="M1202 410H1050" stroke="#8B5CF6" stroke-opacity="0.28"/>
      <path d="M1202 410V382" stroke="#8B5CF6" stroke-opacity="0.28"/>
    </g>

    <rect x="44" y="44" width="1192" height="392" rx="24" fill="#04060B" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <rect x="82" y="74" width="250" height="38" rx="19" fill="#0C1425" stroke="#334155"/>
    <circle cx="106" cy="93" r="5" fill="#34D399">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="122" y="99" fill="#CBD5E1" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="16">Hamburg · Open to next-step roles</text>

    <text x="86" y="162" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="18" letter-spacing="4">IT SUPPORT SPECIALIST → CLOUD SECURITY</text>
    <text x="86" y="238" fill="url(#titleGrad)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="68" font-weight="800">JANNIK RICHTER</text>
    <text x="86" y="290" fill="url(#accentGrad)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="34" font-weight="700" filter="url(#neon)">Azure · Entra ID · KQL · IAM · Bicep</text>

    <g>
      <rect x="86" y="316" width="468" height="36" rx="18" fill="#09111E" stroke="#8B5CF6" stroke-opacity="0.42"/>
      <text x="104" y="340" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">$ learn → build → investigate → prove</text>
      <rect x="399" y="323" width="10" height="17" rx="2" fill="#67E8F9">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0.78">
      <rect x="86" y="374" width="112" height="24" rx="12" fill="#0A1220" stroke="#8B5CF6" stroke-opacity="0.26"/>
      <text x="104" y="390" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">identity-first</text>
      <rect x="208" y="374" width="112" height="24" rx="12" fill="#0A1220" stroke="#67E8F9" stroke-opacity="0.22"/>
      <text x="229" y="390" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">kql-labs</text>
      <rect x="330" y="374" width="132" height="24" rx="12" fill="#0A1220" stroke="#8B5CF6" stroke-opacity="0.22"/>
      <text x="349" y="390" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">zero-trust-path</text>
    </g>

    <g>
      <rect x="770" y="72" width="420" height="260" rx="24" fill="#08101B" fill-opacity="0.86" stroke="#93C5FD" stroke-opacity="0.18"/>
      <g opacity="0.92">
        <circle cx="796" cy="97" r="4" fill="#FB7185"/>
        <circle cx="812" cy="97" r="4" fill="#FBBF24"/>
        <circle cx="828" cy="97" r="4" fill="#34D399"/>
      </g>
      <text x="850" y="102" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">focus.live</text>
      <text x="800" y="142" fill="#6EE7B7" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15">current = ["Azure", "Entra", "KQL"]</text>
      <text x="800" y="175" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15">goal    = "Cloud Security / SOC"</text>
      <text x="800" y="208" fill="#D8B4FE" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15">method  = "learn → build → explain"</text>
      <text x="800" y="241" fill="#FDE68A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15">status  = "hands-on / active"</text>
      <text x="800" y="274" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15">stack   = ["IAM", "Zero Trust", "Bicep"]</text>
      <text x="800" y="307" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">&gt; support foundation → cloud skills → investigations</text>
      <rect x="1120" y="294" width="9" height="15" rx="2" fill="#67E8F9">
        <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0.65">
      <rect x="770" y="350" width="144" height="34" rx="17" fill="#0A1220" stroke="#8B5CF6" stroke-opacity="0.22"/>
      <text x="792" y="372" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">AZ-900 prep</text>
      <rect x="926" y="350" width="144" height="34" rx="17" fill="#0A1220" stroke="#67E8F9" stroke-opacity="0.22"/>
      <text x="949" y="372" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">SC-900 prep</text>
      <rect x="1082" y="350" width="108" height="34" rx="17" fill="#0A1220" stroke="#8B5CF6" stroke-opacity="0.22"/>
      <text x="1108" y="372" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">KQL labs</text>
    </g>

    <rect x="0" y="0" width="1280" height="480" fill="url(#bg)" opacity="0.06">
      <animateTransform attributeName="transform" type="translate" values="0 -480; 0 480" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1278" height="478" rx="27" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
