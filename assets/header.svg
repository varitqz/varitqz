    <text x="886" y="108" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">CURRENT SIGNAL</text>
    <line x1="886" y1="124" x2="1170" y2="124" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="886" y="156" fill="#E5E7EB" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="18">Azure / Entra ID</text>
