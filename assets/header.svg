  </g>

  <text x="72" y="155" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" letter-spacing="4">IT SUPPORT SPECIALIST · CLOUD SECURITY FOCUS</text>

  <text x="72" y="215" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="60" font-weight="700">JANNIK RICHTER</text>

  <text x="72" y="268" fill="url(#accent)" filter="url(#softGlow)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="34" font-weight="700">Azure · Entra ID · KQL · IAM · Bicep</text>

  <g>
