<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jannik Richter — Cloud Security</title>
  <desc id="desc">Animated cloud security header with neon grid, orbit rings and terminal panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420"><stop stop-color="#03040A"/><stop offset=".5" stop-color="#070A13"/><stop offset="1" stop-color="#091326"/></linearGradient>
    <radialGradient id="vg" cx="0" cy="0" r="1" gradientTransform="translate(230 90) rotate(18) scale(470 210)"><stop stop-color="#8B5CF6" stop-opacity=".52"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cg" cx="0" cy="0" r="1" gradientTransform="translate(1050 255) rotate(-20) scale(390 190)"><stop stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="80" y1="0" x2="750" y2="0"><stop stop-color="#F8FAFC"/><stop offset=".55" stop-color="#D8B4FE"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="650" y2="0"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;0 34" dur="18s" repeatCount="indefinite"/></rect>
  <ellipse cx="230" cy="90" rx="470" ry="210" fill="url(#vg)"><animate attributeName="opacity" values=".72;1;.72" dur="7s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1050" cy="255" rx="390" ry="190" fill="url(#cg)"><animate attributeName="opacity" values=".75;.45;.75" dur="6s" repeatCount="indefinite"/></ellipse>
  <g opacity=".3" fill="none"><circle cx="1040" cy="210" r="88" stroke="#8B5CF6"/><circle cx="1040" cy="210" r="126" stroke="#67E8F9"/><circle cx="1040" cy="210" r="166" stroke="#8B5CF6"/></g>
  <g><circle cx="1040" cy="44" r="4.2" fill="#67E8F9" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 1040 210" to="360 1040 210" dur="13s" repeatCount="indefinite"/></circle><circle cx="914" cy="210" r="4" fill="#A78BFA" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 1040 210" to="-360 1040 210" dur="10s" repeatCount="indefinite"/></circle></g>
  <path d="M0 86H1280M0 334H1280" stroke="#fff" stroke-opacity=".035"/>
  <rect x="42" y="42" width="1196" height="336" rx="22" fill="#050812" fill-opacity=".18" stroke="#fff" stroke-opacity=".08"/>
  <rect x="74" y="66" width="252" height="36" rx="18" fill="#0B1220" stroke="#334155"/><circle cx="98" cy="84" r="5" fill="#34D399"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle><text x="114" y="90" fill="#CBD5E1" font-family="ui-sans-serif,system-ui,Segoe UI,Arial" font-size="16">Hamburg · Cloud Security Path</text>
  <text x="78" y="150" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" letter-spacing="3.5">IT SUPPORT SPECIALIST → CLOUD SECURITY</text>
  <text x="76" y="222" fill="url(#name)" font-family="ui-sans-serif,system-ui,Segoe UI,Arial" font-size="68" font-weight="800">JANNIK RICHTER</text>
  <text x="78" y="270" fill="url(#accent)" font-family="ui-sans-serif,system-ui,Segoe UI,Arial" font-size="31" font-weight="700" filter="url(#glow)">Azure · Entra ID · KQL · IAM · Bicep</text>
  <rect x="78" y="296" width="470" height="38" rx="16" fill="#08111E" stroke="#8B5CF6" stroke-opacity=".42"/><text x="98" y="321" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">$ learn → build → investigate → prove</text><rect x="421" y="306" width="9" height="16" rx="2" fill="#67E8F9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <g><rect x="760" y="76" width="410" height="230" rx="22" fill="#08101B" fill-opacity=".86" stroke="#67E8F9" stroke-opacity=".17"/><circle cx="786" cy="101" r="4" fill="#FB7185"/><circle cx="802" cy="101" r="4" fill="#FBBF24"/><circle cx="818" cy="101" r="4" fill="#34D399"/><text x="842" y="106" fill="#64748B" font-family="ui-monospace,Consolas,monospace" font-size="14">cloudsec.live</text><text x="790" y="149" fill="#6EE7B7" font-family="ui-monospace,Consolas,monospace" font-size="15">current = ["Azure", "Entra", "KQL"]</text><text x="790" y="183" fill="#93C5FD" font-family="ui-monospace,Consolas,monospace" font-size="15">goal    = "Cloud Security / SOC"</text><text x="790" y="217" fill="#D8B4FE" font-family="ui-monospace,Consolas,monospace" font-size="15">path    = "Identity → Detection"</text><text x="790" y="251" fill="#FDE68A" font-family="ui-monospace,Consolas,monospace" font-size="15">status  = "hands-on"</text><text x="790" y="281" fill="#CBD5E1" font-family="ui-monospace,Consolas,monospace" font-size="13">&gt; support.foundation --upgrade security</text><rect x="1087" y="268" width="9" height="15" rx="2" fill="#67E8F9"><animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/></rect></g>
  <g opacity=".6"><path d="M742 350C850 323 952 388 1100 348" stroke="#8B5CF6" stroke-opacity=".35"/><path d="M730 365C868 344 1010 396 1190 354" stroke="#67E8F9" stroke-opacity=".2"/><circle r="4" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite" path="M742 350C850 323 952 388 1100 348"/></circle></g>
  <rect x="1" y="1" width="1278" height="418" rx="27" stroke="#fff" stroke-opacity=".08"/>
</svg>
