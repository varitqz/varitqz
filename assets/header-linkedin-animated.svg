    <text x="24" y="122" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Cloud Security</text>
    <text x="24" y="151" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Fundamentals Lab</text>
    <text x="24" y="184" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">AZ-900 • SC-900 • Identity</text>
    <text x="24" y="208" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Zero Trust • KQL</text>
    <text x="24" y="222" opacity="0">.</text>
  </g>

  <g transform="translate(1012 172)">
    <rect width="250" height="230" rx="22" fill="#07111f" stroke="#1f4068"/>
    <rect x="24" y="25" width="58" height="58" rx="16" fill="#10132f" stroke="#6d28d9"/>
    <path d="M40 42H57L68 53V72H40Z M57 42V53H68" stroke="#a78bfa" stroke-width="2.4" fill="none"/>
    <path d="M46 59H62M46 65H62" stroke="#a78bfa" stroke-width="2.2"/>
    <text x="211" y="43" fill="#7185a6" font-family="Consolas,monospace" font-size="15">02</text>
    <text x="24" y="122" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Interactive</text>
    <text x="24" y="151" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Portfolio / CV</text>
    <text x="24" y="184" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Recruiter-ready personal site</text>
    <text x="24" y="208" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">GitHub Pages</text>
  </g>

  <g transform="translate(1279 172)">
    <rect width="250" height="230" rx="22" fill="#07111f" stroke="#1f4068"/>
    <rect x="24" y="25" width="58" height="58" rx="16" fill="#091c1b" stroke="#0f766e"/>
    <circle cx="50" cy="51" r="11" stroke="#5eead4" stroke-width="2.5"/><path d="M59 60L71 72" stroke="#5eead4" stroke-width="2.5"/>
    <text x="211" y="43" fill="#7185a6" font-family="Consolas,monospace" font-size="15">03</text>
    <text x="24" y="122" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="24" font-weight="700">Investigation Cases</text>
    <text x="24" y="184" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Failed Sign-in • Role Assignments</text>
    <text x="24" y="208" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Endpoint Discovery</text>
  </g>

  <g opacity=".58">
    <circle cx="1390" cy="86" r="110" stroke="#60a5fa" stroke-opacity=".28"/>
    <circle cx="1390" cy="86" r="145" stroke="#5eead4" stroke-opacity=".16"/>
    <circle cx="1390" cy="86" r="5" fill="#5eead4" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="1410" y="92" fill="#c7d7ed" font-family="Consolas,monospace" font-size="14" letter-spacing="2">HAMBURG</text>
  </g>

  <rect x="0" y="-12" width="1600" height="3" fill="#60a5fa" opacity=".18"><animate attributeName="y" from="-12" to="532" dur="7s" repeatCount="indefinite"/></rect>
