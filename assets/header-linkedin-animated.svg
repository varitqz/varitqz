      <text x="26" y="239" fill="#94A3B8" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="18">Endpoint Discovery</text>
      <text x="26" y="276" fill="#5EEAD4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" letter-spacing="2">REAL-WORLD QUERIES</text>
