<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jannik Richter — Cloud Security</title>
  <desc id="desc">Animated cloud security banner with balanced spacing and featured projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#050914"/><stop offset="0.5" stop-color="#07111F"/><stop offset="1" stop-color="#0A1730"/></linearGradient>
    <linearGradient id="name" x1="80" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#60A5FA"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <radialGradient id="glowL"><stop stop-color="#2563EB" stop-opacity=".28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR"><stop stop-color="#14B8A6" stop-opacity=".16"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1600" height="520" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="520" fill="url(#bg)"/>
    <rect width="1600" height="520" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;0 28" dur="18s" repeatCount="indefinite"/></rect>
    <ellipse cx="180" cy="430" rx="360" ry="240" fill="url(#glowL)"><animate attributeName="opacity" values=".7;1;.7" dur="7s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1490" cy="450" rx="320" ry="220" fill="url(#glowR)"><animate attributeName="opacity" values=".8;.5;.8" dur="8s" repeatCount="indefinite"/></ellipse>
    <path d="M910 -10C1110 30 1180 110 1275 235C1370 360 1490 405 1600 416" stroke="#60A5FA" stroke-opacity=".13" stroke-width="1.5"/>
    <path d="M935 72C1130 50 1290 104 1410 210C1500 288 1555 316 1600 316" stroke="#5EEAD4" stroke-opacity=".11" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".07;.18;.07" dur="6s" repeatCount="indefinite"/></path>

    <rect x="72" y="102" width="430" height="40" rx="20" fill="#081323" stroke="#24476F"/>
    <circle cx="98" cy="122" r="6" fill="#5EEAD4" filter="url(#soft)"><animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/></circle>
    <text x="122" y="130" fill="#CBD5E1" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="3">HAMBURG • IT SUPPORT → CLOUD SECURITY</text>

    <text x="72" y="255" fill="url(#name)" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="800">Jannik Richter</text>
    <text x="74" y="321" fill="#CBD5E1" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="1.4">Azure • Entra ID • KQL • IAM • Zero Trust • Bicep</text>

    <rect x="72" y="360" width="506" height="56" rx="16" fill="#071121" stroke="#376FAE"/>
    <text x="98" y="397" fill="url(#flow)" font-family="Consolas,Menlo,monospace" font-size="23">learn → build → investigate → prove</text>
    <rect x="493" y="375" width="10" height="21" rx="2" fill="#5EEAD4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <path d="M72 452V488" stroke="#60A5FA" stroke-width="4"/>
    <text x="96" y="468" fill="#7387A8" font-family="Consolas,Menlo,monospace" font-size="17" letter-spacing="3">SECURE TODAY.</text>
    <text x="96" y="497" fill="#7387A8" font-family="Consolas,Menlo,monospace" font-size="17" letter-spacing="3">ENABLE TOMORROW.</text>

    <text x="735" y="138" fill="#B9C7DE" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="5">FEATURED PROJECTS</text>
    <path d="M940 130H1518" stroke="#60A5FA" stroke-opacity=".35"/>

    <g transform="translate(735 170)"><rect width="240" height="240" rx="22" fill="#07111F" stroke="#1F4068"/><rect x="22" y="24" width="58" height="58" rx="16" fill="#0B1730" stroke="#2563EB"/><path d="M37 59C37 51 44 46 52 46C58 46 63 50 64 56C70 56 74 60 74 65C74 70 70 74 65 74H45C40 74 37 70 37 66Z" stroke="#60A5FA" stroke-width="2.5"/><text x="201" y="41" fill="#7185A6" font-family="Consolas,monospace" font-size="14">01</text><text x="22" y="126" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Cloud Security</text><text x="22" y="154" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Fundamentals Lab</text><text x="22" y="193" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">AZ-900 • SC-900 • Identity</text><text x="22" y="217" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">Zero Trust • KQL</text></g>

    <g transform="translate(995 170)"><rect width="240" height="240" rx="22" fill="#07111F" stroke="#1F4068"/><rect x="22" y="24" width="58" height="58" rx="16" fill="#10132F" stroke="#6D28D9"/><path d="M38 42H56L67 53V72H38Z M56 42V53H67" stroke="#A78BFA" stroke-width="2.4" fill="none"/><path d="M44 59H61M44 65H61" stroke="#A78BFA" stroke-width="2.2"/><text x="201" y="41" fill="#7185A6" font-family="Consolas,monospace" font-size="14">02</text><text x="22" y="126" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Interactive</text><text x="22" y="154" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Portfolio / CV</text><text x="22" y="193" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">Recruiter-ready personal site</text><text x="22" y="217" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">GitHub Pages</text></g>

    <g transform="translate(1255 170)"><rect width="240" height="240" rx="22" fill="#07111F" stroke="#1F4068"/><rect x="22" y="24" width="58" height="58" rx="16" fill="#091C1B" stroke="#0F766E"/><circle cx="49" cy="51" r="11" stroke="#5EEAD4" stroke-width="2.5"/><path d="M58 60L70 72" stroke="#5EEAD4" stroke-width="2.5"/><text x="201" y="41" fill="#7185A6" font-family="Consolas,monospace" font-size="14">03</text><text x="22" y="140" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="20" font-weight="700">Investigation Cases</text><text x="22" y="193" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">Failed Sign-in • Role Assignments</text><text x="22" y="217" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">Endpoint Discovery</text></g>

    <circle cx="1518" cy="92" r="5" fill="#5EEAD4" filter="url(#soft)"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="1534" y="98" fill="#9FB2CF" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2">HAMBURG</text>
    <rect x="0" y="-10" width="1600" height="2" fill="#60A5FA" opacity=".12"><animate attributeName="y" from="-10" to="530" dur="8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="1598" height="518" rx="25" stroke="#fff" stroke-opacity=".07"/>
</svg>