<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Jannik Richter — Cloud Security</title>
<desc id="desc">Animated LinkedIn-style cloud security banner with featured projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520"><stop stop-color="#050914"/><stop offset=".5" stop-color="#07111f"/><stop offset="1" stop-color="#0a1830"/></linearGradient>
  <linearGradient id="name" x1="70" y1="0" x2="650" y2="0"><stop stop-color="#f8fafc"/><stop offset=".52" stop-color="#60a5fa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="520" y2="0"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
  <radialGradient id="g1"><stop stop-color="#2563eb" stop-opacity=".30"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop stop-color="#14b8a6" stop-opacity=".20"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="c"><rect width="1600" height="520" rx="26"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;0 28" dur="18s" repeatCount="indefinite"/></rect>
  <ellipse cx="180" cy="420" rx="360" ry="240" fill="url(#g1)"><animate attributeName="opacity" values=".65;1;.65" dur="7s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1420" cy="450" rx="360" ry="240" fill="url(#g2)"><animate attributeName="opacity" values=".8;.45;.8" dur="8s" repeatCount="indefinite"/></ellipse>
  <path d="M760 20C980 40 1050 125 1135 245C1228 376 1398 420 1600 430" stroke="#60a5fa" stroke-opacity=".20" stroke-width="1.4"/>
  <path d="M790 102C1010 70 1185 125 1320 240C1440 342 1520 358 1600 350" stroke="#5eead4" stroke-opacity=".18" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".10;.34;.10" dur="6s" repeatCount="indefinite"/></path>

  <rect x="70" y="102" width="420" height="40" rx="20" fill="#081323" stroke="#24476f"/>
  <circle cx="96" cy="122" r="6" fill="#5eead4" filter="url(#glow)"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></circle>
  <text x="120" y="130" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="3">HAMBURG  •  IT SUPPORT  →  CLOUD SECURITY</text>
  <path d="M510 122H700" stroke="#5eead4" stroke-width="2" stroke-opacity=".65" stroke-dasharray="55 135"><animate attributeName="stroke-dashoffset" from="0" to="-190" dur="4s" repeatCount="indefinite"/></path>

  <text x="70" y="260" fill="url(#name)" font-family="Arial,Helvetica,sans-serif" font-size="98" font-weight="800">Jannik Richter</text>
  <text x="72" y="326" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="29" letter-spacing="2">Azure  •  Entra ID  •  KQL  •  IAM  •  Zero Trust  •  Bicep</text>
  <rect x="70" y="364" width="500" height="56" rx="16" fill="#071121" stroke="#376fae"/>
  <text x="96" y="400" fill="url(#flow)" font-family="Consolas,Menlo,monospace" font-size="24">learn → build → investigate → prove</text>
  <rect x="490" y="380" width="11" height="21" rx="2" fill="#5eead4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <path d="M70 457V492" stroke="#60a5fa" stroke-width="4"/>
  <text x="94" y="472" fill="#7387a8" font-family="Consolas,Menlo,monospace" font-size="17" letter-spacing="3">SECURE TODAY.</text>
  <text x="94" y="500" fill="#7387a8" font-family="Consolas,Menlo,monospace" font-size="17" letter-spacing="3">ENABLE TOMORROW.</text>

  <text x="745" y="145" fill="#b9c7de" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="5">FEATURED PROJECTS</text>
  <path d="M945 137H1530" stroke="#60a5fa" stroke-opacity=".40"/>

