      <text x="92" y="470" fill="#7C8EA9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="18" letter-spacing="3">SECURE TODAY.</text>
      <text x="92" y="497" fill="#7C8EA9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="18" letter-spacing="3">ENABLE TOMORROW.</text>
    </g>

