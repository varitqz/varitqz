<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jannik Richter animated GitHub profile banner</title>
  <desc id="desc">Animated dark cloud security banner inspired by a polished LinkedIn header, showing Jannik Richter, cloud security focus, Hamburg, and featured projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040812"/>
      <stop offset="0.45" stop-color="#06101F"/>
      <stop offset="1" stop-color="#0A1730"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 400) rotate(-12) scale(280 180)">
      <stop stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(460 130) rotate(6) scale(520 240)">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1430 470) rotate(-18) scale(360 220)">
      <stop stop-color="#06B6D4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="65" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1600" height="520" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1600" height="520" rx="26" fill="url(#bg)"/>
    <rect width="1600" height="520" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 28" dur="18s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="180" cy="400" rx="280" ry="180" fill="url(#leftGlow)">
      <animate attributeName="opacity" values="0.75;1;0.78;0.75" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="460" cy="130" rx="520" ry="240" fill="url(#centerGlow)"/>
    <ellipse cx="1430" cy="470" rx="360" ry="220" fill="url(#rightGlow)">
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <g opacity="0.18">
      <path d="M0 85H1600" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <path d="M0 260H1600" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <path d="M0 430H1600" stroke="#FFFFFF" stroke-opacity="0.08"/>
    </g>

    <path d="M845 0C960 44 1048 131 1089 245C1126 347 1230 432 1600 468" stroke="#1D4ED8" stroke-opacity="0.32" stroke-width="1.5"/>
    <path d="M822 18C998 56 1140 157 1188 292C1234 398 1353 483 1600 520" stroke="#60A5FA" stroke-opacity="0.24" stroke-width="1.5"/>
    <path d="M790 112C960 75 1125 118 1265 225C1386 318 1492 341 1600 336" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.14;0.34;0.14" dur="6s" repeatCount="indefinite"/>
    </path>

    <rect x="68" y="106" width="405" height="38" rx="19" fill="#081224" stroke="#274C7A" stroke-opacity="0.75"/>
    <circle cx="93" cy="125" r="6" fill="#5EEAD4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="116" y="132" fill="#CBD5E1" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="18" letter-spacing="3">HAMBURG  •  IT SUPPORT  →  CLOUD SECURITY</text>

    <path d="M492 125H735" stroke="#5EEAD4" stroke-opacity="0.72" stroke-width="2" filter="url(#lineGlow)">
      <animate attributeName="stroke-dasharray" values="0 243;243 0;0 243" dur="6s" repeatCount="indefinite"/>
    </path>

    <text x="68" y="262" fill="url(#nameGrad)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="98" font-weight="800">Jannik Richter</text>
    <text x="70" y="332" fill="#CBD5E1" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="18" letter-spacing="0.8">Azure  •  Entra ID  •  KQL  •  IAM  •  Zero Trust  •  Bicep</text>

    <rect x="68" y="368" width="490" height="54" rx="16" fill="#071121" stroke="#3B82F6" stroke-opacity="0.55"/>
    <text x="93" y="403" fill="url(#pillGrad)" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="24">learn  →  build  →  investigate  →  prove</text>
    <rect x="485" y="383" width="12" height="20" rx="2" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0.76">
