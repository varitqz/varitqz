      <text x="26" y="173" fill="#F1F5F9" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="28" font-weight="700">Fundamentals Lab</text>
      <text x="26" y="212" fill="#94A3B8" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="18">AZ-900 • SC-900 • Identity •</text>
